# Draws the contribution snake in the comic palette and publishes it to the `output` branch.
name: comic snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-comic.svg?color_snake=#E5371C&color_dots=#E7DCC5,#F9DE8C,#F7C531,#E88A6E,#16130F
            dist/snake-comic-dark.svg?palette=github-dark&color_snake=#F7C531&color_dots=#2A2520,#5C3A1E,#B8260F,#E5371C,#F7C531

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
